[package]
name = "runman-agent"
version = "0.1.9"
edition = "2024"
rust-version = "1.89"
description = "Runman node agent: system-container runtime managed by the Narwhal Cloud platform"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "runman-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bcrypt = "0.19.3"
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
async-trait = "0.1.92"
clap = { version = "4.6.9", features = ["derive"] }
libc = "0.2.191"
nix = { version = "0.32.0", features = ["fs", "hostname", "ioctl", "mount", "poll", "process", "sched", "signal", "term", "user"] }
sha-crypt = "0.6.0"
sha2 = "0.11.1"
prost = "0.14.6"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
toml = "0.9.8"
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen", "server", "router", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

[build-dependencies]
protoc-bin-vendored = "3.3.0"
tonic-prost-build = "0.14.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
