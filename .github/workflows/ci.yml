name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (protocol, panel, unit)
        run: cargo test
      - name: Installer
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S style install.sh
          bash install.sh --help >/dev/null

  # Real containers on the runner VM: needs root, systemd and network.
  integration:
    runs-on: ubuntu-24.04
    # Not verified on GitHub-hosted runners yet; keep it informative until it
    # has passed there a few times.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Host packages and limits (as install.sh sets them)
        run: |
          sudo apt-get install -y -qq nftables wireguard-tools e2fsprogs lxcfs
          sudo install -d /etc/systemd/system/lxcfs.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/lxcfs --enable-cfs -l /var/lib/lxcfs\n' \
            | sudo tee /etc/systemd/system/lxcfs.service.d/runman.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart lxcfs
          sudo sysctl -q -w fs.inotify.max_user_instances=65536
      - name: Build tests
        run: cargo test --release --test runtime_linux --no-run
      - name: Runtime integration tests
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" \
            cargo test --release --test runtime_linux -- --ignored --test-threads=1 \
            instance_lifecycle ipv6_snat_mode concurrent_creates_get_distinct_slots 2>&1 | tee test.log
      - name: Report integration failure
        if: failure()
        run: |
          # Surface the failing assertion as annotations (readable without log access).
          grep -A6 -E "panicked at|^Caused by" test.log | head -40 | while IFS= read -r line; do
            echo "::error title=runtime_linux::$line"
          done
          sudo journalctl -u 'runman-*' --no-pager -n 30 | while IFS= read -r line; do echo "::warning title=journal::$line"; done
